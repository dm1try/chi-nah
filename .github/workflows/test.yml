name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: hook tests (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "3.4", "4.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: ${{ matrix.ruby }}
      # minitest is a bundled gem; install it in case this Ruby left it out.
      - run: gem list -i minitest >/dev/null || gem install minitest
      # The tests run on chi's bundle test kit (samagotchi/testing).
      - run: gem install samagotchi -v ">= 0.80.0" --no-document
      - run: ruby -Itest test/nah_guard_test.rb
